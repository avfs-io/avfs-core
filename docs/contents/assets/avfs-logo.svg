<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feFlood flood-color="#0D47A1" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square -->
  <rect x="7" y="7" width="114" height="114" rx="20" ry="20"
        fill="#0A1628" stroke="#1565C0" stroke-width="2"
        filter="url(#shadow)"/>

  <!--
    6-axis radar chart, center at (64, 57), outer radius = 38
    5 layers: r = 7.6 / 15.2 / 22.8 / 30.4 / 38
  -->

  <!-- 6 axis rays -->
  <line x1="64" y1="57" x2="64"   y2="19"  stroke="#1565C0" stroke-width="1" opacity="0.40"/>
  <line x1="64" y1="57" x2="96.9" y2="38"  stroke="#1565C0" stroke-width="1" opacity="0.40"/>
  <line x1="64" y1="57" x2="96.9" y2="76"  stroke="#1565C0" stroke-width="1" opacity="0.40"/>
  <line x1="64" y1="57" x2="64"   y2="95"  stroke="#1565C0" stroke-width="1" opacity="0.40"/>
  <line x1="64" y1="57" x2="31.1" y2="76"  stroke="#1565C0" stroke-width="1" opacity="0.40"/>
  <line x1="64" y1="57" x2="31.1" y2="38"  stroke="#1565C0" stroke-width="1" opacity="0.40"/>

  <!-- Layer 5 (outermost, r=38) -->
  <polygon points="64,19 96.9,38 96.9,76 64,95 31.1,76 31.1,38"
           fill="none" stroke="#1565C0" stroke-width="1" opacity="0.32"/>

  <!-- Layer 4 (r=30.4) -->
  <polygon points="64,26.6 90.3,41.8 90.3,72.2 64,87.4 37.7,72.2 37.7,41.8"
           fill="none" stroke="#1565C0" stroke-width="1.1" opacity="0.42"/>

  <!-- Layer 3 (r=22.8) - filled coverage area -->
  <polygon points="64,34.2 83.7,45.6 83.7,68.4 64,79.8 44.3,68.4 44.3,45.6"
           fill="url(#coverGrad)" stroke="#00E5FF" stroke-width="1.3" opacity="0.75"/>

  <!-- Layer 2 (r=15.2) -->
  <polygon points="64,41.8 77.2,49.4 77.2,64.6 64,72.2 50.8,64.6 50.8,49.4"
           fill="none" stroke="#1565C0" stroke-width="1" opacity="0.34"/>

  <!-- Layer 1 (innermost, r=7.6) -->
  <polygon points="64,49.4 70.6,53.2 70.6,60.8 64,64.6 57.4,60.8 57.4,53.2"
           fill="none" stroke="#1565C0" stroke-width="0.9" opacity="0.28"/>

  <!-- Data points on layer 3 (subtle) -->
  <circle cx="64"   cy="34.2" r="1.3" fill="#4DD0E1" opacity="0.40"/>
  <circle cx="83.7" cy="45.6" r="1.3" fill="#4DD0E1" opacity="0.40"/>
  <circle cx="83.7" cy="68.4" r="1.3" fill="#4DD0E1" opacity="0.40"/>
  <circle cx="64"   cy="79.8" r="1.3" fill="#4DD0E1" opacity="0.40"/>
  <circle cx="44.3" cy="68.4" r="1.3" fill="#4DD0E1" opacity="0.40"/>
  <circle cx="44.3" cy="45.6" r="1.3" fill="#4DD0E1" opacity="0.40"/>

  <!-- Outer vertex nodes (subdued) -->
  <circle cx="64"   cy="19"  r="2.5" fill="#1E88E5" stroke="#00E5FF" stroke-width="0.8" opacity="0.55"/>
  <circle cx="96.9" cy="38"  r="2.5" fill="#1E88E5" stroke="#00E5FF" stroke-width="0.8" opacity="0.55"/>
  <circle cx="96.9" cy="76"  r="2.5" fill="#1E88E5" stroke="#00E5FF" stroke-width="0.8" opacity="0.55"/>
  <circle cx="64"   cy="95"  r="2.5" fill="#1E88E5" stroke="#00E5FF" stroke-width="0.8" opacity="0.55"/>
  <circle cx="31.1" cy="76"  r="2.5" fill="#1E88E5" stroke="#00E5FF" stroke-width="0.8" opacity="0.55"/>
  <circle cx="31.1" cy="38"  r="2.5" fill="#1E88E5" stroke="#00E5FF" stroke-width="0.8" opacity="0.55"/>

  <!-- Center hub -->
  <circle cx="64" cy="57" r="4.5" fill="#00E5FF" filter="url(#glowStrong)"/>

  <!-- White highlights -->
  <circle cx="64"   cy="19"  r="1" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="96.9" cy="38"  r="1" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="96.9" cy="76"  r="1" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="64"   cy="95"  r="1" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="31.1" cy="76"  r="1" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="31.1" cy="38"  r="1" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="64"   cy="57"  r="2" fill="#FFFFFF" opacity="0.9"/>

  <!-- avfs.io brand text -->
  <text x="64" y="113" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="11" font-weight="600" letter-spacing="1"
        fill="#4DD0E1" opacity="0.7">avfs.io</text>
</svg>
